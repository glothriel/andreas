baseURL: 'https://andreas.karagiorgis.pl/'
title: 'Andreas Karagiorgis'
defaultContentLanguage: pl
# resizing the full-size gallery originals from scratch (CI has no cache) takes minutes
timeout: 10m
enableRobotsTXT: true
disableKinds: [taxonomy, term]

permalinks:
  page:
    posts: /opowiadania/:filename/
    page: /:filename/

languages:
  pl:
    languageName: Polski
    languageCode: pl
    weight: 1
    title: Andreas Karagiorgis
    params:
      description: Akwarele z Santorini, ilustracje dla wnuków i opowiadania.
  en:
    languageName: English
    languageCode: en
    weight: 2
    title: Andreas Karagiorgis
    params:
      description: Watercolours from Santorini, drawings for grandchildren and short stories.
  el:
    languageName: Ελληνικά
    languageCode: el
    weight: 3
    title: Ανδρέας Καραγιώργης
    params:
      author: Ανδρέας Καραγιώργης
      description: Ακουαρέλες από τη Σαντορίνη, σχέδια για τα εγγόνια και διηγήματα.

params:
  author: Andreas Karagiorgis
  # The contact widget posts straight into this Google Form (one inbox for every language).
  # Field ids come from the form's page source (FB_PUBLIC_LOAD_DATA_).
  contactForm:
    action: https://docs.google.com/forms/d/e/1FAIpQLSeJgDM7wRRehAgYWUcWDJQW-iVXVq1-R2Mkbj-e9GDp-EFdGA/formResponse
    nameField: entry.1602808160
    messageField: entry.437352756

markup:
  goldmark:
    renderer:
      unsafe: true

# Page-bundle images are published only when a template asks for them (.RelPermalink),
# so the 10+ MB originals never land in public/, only their resized copies.
cascade:
  build:
    publishResources: false
